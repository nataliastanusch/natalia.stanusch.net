{{ with .Params.tags }}
<ul class="tags">
  {{ range . }}
    {{ $term := site.GetPage (printf "/tags/%s" (urlize .)) }}
    <li>
      {{ if $term }}
        <a href="{{ $term.RelPermalink }}">{{ . }}</a>
      {{ else }}
        <span>{{ . }}</span>
      {{ end }}
    </li>
  {{ end }}
</ul>
{{ end }}

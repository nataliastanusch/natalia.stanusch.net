<header class="shell topbar">
  <a class="site-name" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>

  {{ partial "nav.html" . }}

  <button class="theme-toggle" type="button" data-mode="light"
          aria-pressed="false" aria-label="Switch to dark theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 13.4A8.2 8.2 0 0 1 10.6 4a8.4 8.4 0 1 0 9.4 9.4z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <line x1="12" y1="2.5" x2="12" y2="4.8"/>
      <line x1="12" y1="19.2" x2="12" y2="21.5"/>
      <line x1="2.5" y1="12" x2="4.8" y2="12"/>
      <line x1="19.2" y1="12" x2="21.5" y2="12"/>
      <line x1="5.3" y1="5.3" x2="6.9" y2="6.9"/>
      <line x1="17.1" y1="17.1" x2="18.7" y2="18.7"/>
      <line x1="18.7" y1="5.3" x2="17.1" y2="6.9"/>
      <line x1="6.9" y1="17.1" x2="5.3" y2="18.7"/>
    </svg>
  </button>

  {{/* Hidden until someone clicks the header five times. */}}
  <div class="accent-panel" hidden>
    <label class="accent-label" for="accent-select">Accent</label>

    <select class="accent-select" id="accent-select">
      <option value="#9b0012">Crimson</option>
      <option value="#12386b">Deep blue</option>
      <option value="#0f5132">Forest</option>
      <option value="#5b1f6b">Plum</option>
      <option value="#a34a12">Rust</option>
      <option value="#0d5c63">Teal</option>
      <option value="#7a1f3d">Mulberry</option>
      <option value="#2f2f35">Graphite</option>
    </select>

    <input class="accent-custom" type="color" value="#9b0012" aria-label="Custom accent colour">

    <button class="accent-reset" type="button">Reset</button>
    <button class="accent-close" type="button" aria-label="Close">&times;</button>
  </div>
</header>

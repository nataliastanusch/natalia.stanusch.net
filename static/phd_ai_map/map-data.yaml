# ============================================================================
# ENTANGLED INTELLIGENCE — controversy map dataset
# ----------------------------------------------------------------------------
# Schema:
#   meta:            title, subtitle, phdCaption (shown when research lens is on)
#   domains:         list of colored rectangles. x/y/w in grid units (1u = 40px).
#                    Height is automatic. Nodes flow into columns inside.
#   nodes:           id (unique, kebab-case), label (short), kind, desc, ref?,
#                    phd? (true marks a research-lens node), phdNote?
#   kinds:           field ◆  stage ▣  issue ▲  incident ✸  response ⚖
#   links:           from/to = node ids. kind: pipeline | cause | feeds | response
#                    pipeline = the LLM production chain (strong arrows)
#                    cause    = leads to / enables (faint arrows)
#                    feeds    = resource/supply relation (faint dashed)
#                    response = lawsuit / law / pushback (long-dash arrows)
# All facts researched & dated as of Sept 2026. Edit freely.
# ============================================================================
meta:
  title: "Entangled Intelligence"
  subtitle: "A controversy map of the AI production stack and its fallout"
  phdCaption: "My research: controversy mapping of AI's fallout — Wikipedia's influence under AI slop; platform-facilitated NCII (Grok on X); and the lawsuits emerging from it."

groups:
  - id: machine
    label: "The machine"
    color: "#7c62e8"
  - id: material
    label: "Material world"
    color: "#d9944b"
  - id: social
    label: "People & platforms"
    color: "#cf4d88"
  - id: political
    label: "Law & politics"
    color: "#4f8fe0"

domains:
  # ------------------------------------------------------------------ DATA --
  - id: data
    label: "Data collection"
    color: "#45b1a8"
    group: machine
    x: 0
    y: 30
    w: 19
    blurb: "Where the corpus comes from"
    nodes:
      - id: training-data-hunger
        label: "Insatiable demand for training data"
        kind: issue
        desc: "Frontier models consume trillions of tokens; the open web, books, code and social platforms are strip-mined to feed them. Every node in this domain follows from it."
        source: "https://www.washingtonpost.com/technology/interactive/2023/ai-chatbot-learning/"
      - id: robots-txt-weakness
        label: "robots.txt has no teeth"
        kind: issue
        desc: "Crawler exclusion is a voluntary convention. AI crawlers ignore it, spoof browser headers and rotate IPs; there is no enforcement mechanism."
        source: "https://datatracker.ietf.org/doc/html/rfc9309"
      - id: anthropic-pirated-library
        label: "Anthropic's 7M pirated books"
        kind: incident
        desc: "2021-22: Anthropic downloaded ~7 million pirated ebooks from LibGen, PiLiMi and Books3 and kept them as an internal 'central library' for training Claude."
        source: "https://fingfx.thomsonreuters.com/gfx/legaldocs/jnvwbgqlzpw/ANTHROPIC%20fair%20use.pdf"
      - id: anthropic-book-destruction
        label: "Destructive scanning of print books"
        kind: incident
        desc: "From 2024 Anthropic bought millions of used print books — including out-of-print and limited editions — cut off their spines, scanned them and pulped the originals to build a training library."
        ref: "trial documents, June 2025"
        source: "https://fingfx.thomsonreuters.com/gfx/legaldocs/jnvwbgqlzpw/ANTHROPIC%20fair%20use.pdf"
      - id: books3
        label: "Books3 shadow dataset"
        kind: incident
        desc: "~196,640 books pirated from Bibliotik, packaged into The Pile (2020) and used by Meta, Bloomberg and others; taken down in Aug 2023 after Danish Rights Alliance DMCA action."
        source: "https://torrentfreak.com/anti-piracy-group-takes-prominent-ai-training-dataset-books3-offline-230816/"
      - id: common-crawl
        label: "Common Crawl's contested archive"
        kind: issue
        desc: "The nonprofit crawl underpins most LLMs (>80% of GPT-3 tokens) for 'the price of a sandwich' (Mozilla, 2024); publisher removal requests go largely unfulfilled, paywalled articles included."
        source: "https://www.mozillafoundation.org/en/research/library/generative-ai-training-data/common-crawl/"
      - id: laion-csam
        label: "CSAM found in LAION-5B"
        kind: incident
        desc: "Stanford Internet Observatory found 1,008 verified CSAM links in LAION-5B, the dataset behind Stable Diffusion; LAION pulled it and released a cleaned version in Aug 2024."
        ref: "SIO, Dec 2023"
        source: "https://www.404media.co/laion-datasets-removed-stanford-csam-child-abuse/"
      - id: laion-medical-photos
        label: "Private medical photos scraped"
        kind: incident
        desc: "An artist found her private post-surgery clinical photos in LAION-5B (2022); thousands of similar medical-record images were confirmed in the dataset."
        source: "https://incidentdatabase.ai/cite/465/"
      - id: claudebot-overload
        label: "ClaudeBot hammers iFixit"
        kind: incident
        desc: "Anthropic's crawler hit iFixit ~1M times in 24 hours despite ToS bans (July 2024); Freelancer.com logged 3.5M hits in 4 hours; one crawler pulled 73TB from Read the Docs."
        source: "https://www.404media.co/anthropic-ai-scraper-hits-ifixits-website-a-million-times-in-a-day/"
      - id: foss-crawler-ddos
        label: "AI crawlers DDoS open-source infra"
        kind: incident
        desc: "SourceHut, GNOME and KDE GitLab servers suffered weekly outages in 2024-25 from LLM scrapers ignoring robots.txt — effectively a permanent low-grade DDoS on volunteer infrastructure."
        source: "https://www.theregister.com/software/2025/03/18/ai-crawlers-havent-learned-to-play-nice-with-websites/1165434"
      - id: wikimedia-bandwidth-crisis
        label: "Wikimedia bot bandwidth crisis"
        kind: incident
        desc: "AI scraping drove Wikimedia multimedia bandwidth up 50% since Jan 2024; bots are ~35% of pageviews but ~65% of the costliest traffic. 'Our content is free, our infrastructure is not.'"
        ref: "WMF, Apr 2025"
        source: "https://diff.wikimedia.org/2025/04/01/how-crawlers-impact-the-operations-of-the-wikimedia-projects/"
      - id: anubis
        label: "Anubis proof-of-work gate"
        kind: response
        desc: "Open-source tool forcing browsers to solve puzzles before access; adopted by GNOME, SourceHut and kernel.org in 2025, cutting bot traffic to a few percent — at the cost of friction for everyone."
        source: "https://github.com/TecharoHQ/anubis"
      - id: cloudflare-blocking
        label: "Cloudflare blocks AI crawlers"
        kind: response
        desc: "AI Labyrinth (Mar 2025) traps non-compliant bots in mazes of decoy pages; from July 2025 Cloudflare blocks AI crawlers by default and runs a Pay-Per-Crawl marketplace."
        source: "https://www.niemanlab.org/2025/07/cloudflare-will-block-ai-scraping-by-default-and-launches-new-pay-per-crawl-marketplace/"
      - id: perplexity-stealth-crawling
        label: "Perplexity evades blocks"
        kind: incident
        desc: "Cloudflare published honeypot evidence (Aug 2025) that Perplexity used undeclared crawlers, rotated IPs/ASNs and ignored robots.txt when blocked; its bots were delisted."
        source: "https://searchengineland.com/cloudflare-vs-perplexity-ai-crawling-460016"
      - id: meta-eu-training
        label: "Meta trains on EU user data"
        kind: incident
        desc: "From May 2025 Meta trains on adult EU Facebook/Instagram posts under GDPR 'legitimate interest' with opt-out only; noyb threatens class action; courts declined to enjoin it."
        source: "https://noyb.eu/en/noyb-sends-meta-cease-and-desist-letter-over-ai-training-european-class-action-potential-next-step"
      - id: x-grok-tos
        label: "X feeds user posts to Grok"
        kind: incident
        desc: "X quietly defaulted users into Grok training (2024); the Irish DPC used emergency GDPR powers, and X agreed to stop using May-Aug 2024 EU posts. ToS now makes training an explicit license grant."
        source: "https://www.dataprotection.ie/en/news-media/press-releases/data-protection-commission-welcomes-conclusion-proceedings-relating-xs-ai-tool-grok"
      - id: reddit-license-or-litigate
        label: "Reddit: license or litigate"
        kind: response
        desc: "Reddit sold data to Google (~$60M/yr) and OpenAI, then sued Anthropic (2025, alleging 100,000+ crawls despite blocks) and Perplexity; Anthropic countersued over the Google-exclusive arrangement."
        source: "https://www.cnbc.com/2025/10/23/reddit-user-data-battle-ai-industry-sues-perplexity-scraping-posts-openai-chatgpt-google-gemini-lawsuit.html"

  # --------------------------------------------------------------- COMMONS --
  - id: commons
    label: "Knowledge commons"
    color: "#9aa7b5"
    group: machine
    x: 23
    y: 30
    w: 12
    blurb: "Scraped for training, starved of readers"
    nodes:
      - id: wikipedia-squeeze
        label: "Wikipedia squeezed by AI"
        kind: issue
        desc: "Wikipedia is the most-cited source in chatbot answers, yet human pageviews fell 8% YoY (WMF, Oct 2025) as AI summaries divert readers — a double squeeze: scraped for free, starved of the traffic, editors and donations that sustain it."
        source: "https://gigazine.net/gsc_news/en/20251019-wikipedia-traffic-falling-ai/"
        phd: true
        phdNote: "PhD thread: Wikipedia's structural influence on the AI stack, and its degradation by AI slop."
      - id: wikiproject-ai-cleanup
        label: "WikiProject AI Cleanup & G15"
        kind: response
        desc: "Volunteer project (2023-) catalogs LLM tells and hoaxes; in Aug 2025 English Wikipedia adopted speedy-deletion criterion G15 to instantly delete AI-slop articles."
        source: "https://www.404media.co/wikipedia-editors-adopt-speedy-deletion-policy-for-ai-slop-articles/"
      - id: wmf-summaries-pause
        label: "WMF pauses AI summaries"
        kind: incident
        desc: "WMF trialed AI article summaries (Cohere Aya, June 2025) and paused within days after overwhelming editor revolt ('Yuck') — a demonstration of volunteer veto power."
        source: "https://www.404media.co/wikipedia-pauses-ai-generated-summaries-after-editor-backlash/"
      - id: grokipedia
        label: "Grokipedia attacks Wikipedia"
        kind: incident
        desc: "Musk launched Grokipedia (Oct 2025, ~885k AI-generated articles) as an 'anti-woke' rival; analyses found content lifted from Wikipedia with rightward slant and factual errors."
        source: "https://www.poynter.org/fact-checking/2025/grokipedia-wikipedia-copy-ai-errors/"
      - id: stackoverflow-revolt
        label: "Stack Overflow data revolt"
        kind: incident
        desc: "After the OpenAI licensing deal (May 2024), users mass-deleted answers in protest and were banned — contributors have no exit from training pipelines. Traffic and new questions have collapsed."
        source: "https://www.tomshardware.com/tech-industry/artificial-intelligence/stack-overflow-bans-users-en-masse-for-rebelling-against-openai-partnership-users-banned-for-deleting-answers-to-prevent-them-being-used-to-train-chatgpt"
      - id: commons-decline
        label: "Decline of the open commons"
        kind: issue
        desc: "Volunteer-made knowledge (wikis, forums, Q&A) loses readers, editors and revenue to the models trained on it — undermining the very source of future training data."
        source: "https://gigazine.net/gsc_news/en/20251019-wikipedia-traffic-falling-ai/"

  # -------------------------------------------------------------------- AI --
  - id: ai
    label: "Artificial intelligence"
    color: "#9d8df0"
    group: machine
    x: 0
    y: 0
    w: 12
    blurb: "The wider field around LLMs"
    nodes:
      - id: llm
        label: "Large language models"
        kind: field
        desc: "The field this map goes deep on — follow the pipeline domain to its right, stage by stage."
        source: "https://www.ibm.com/topics/large-language-models"
      - id: ocr
        label: "OCR"
        kind: field
        desc: "Gatekeeps digitized history (error rates skew non-Latin scripts and old newspapers) and powers surveillance: license-plate reader networks searched for ICE and abortion-related lookups (2025)."
        source: "https://www.404media.co/inside-the-suspicionless-search-network-that-tracks-drivers-around-the-us/"
      - id: nlp-classifiers
        label: "NLP scoring & classification"
        kind: field
        desc: "Pre-LLM classifiers already broke lives: the Dutch toeslagenaffaire risk-scoring falsely accused ~26,000 families and collapsed a government (2021); HireVue dropped facial analysis after an FTC complaint."
        source: "https://www.amnesty.org/en/latest/news/2021/10/xenophobic-machines-dutch-child-benefit-scandal/"
      - id: medical-imaging-ai
        label: "Medical imaging AI"
        kind: field
        desc: "1,000+ FDA-cleared AI devices, yet Epic's sepsis model missed 67% of cases in external validation, and dermatology models underperform on darker skin for lack of representative data."
        source: "https://www.statnews.com/2021/06/21/epic-sepsis-algorithm-external-validation-study/"
      - id: geospatial-targeting
        label: "Geospatial & satellite AI"
        kind: field
        desc: "Israel's 'Lavender' reportedly flagged ~37,000 people as targets with ~10% known error and seconds of human review (+972, Apr 2024); the same field powers deforestation alerts."
        source: "https://www.972mag.com/lavender-ai-israeli-army-gaza/"
      - id: facial-recognition
        label: "Facial recognition"
        kind: field
        desc: "At least seven documented wrongful arrests, nearly all of Black people (Robert Williams, Detroit); FTC banned Rite Aid's face surveillance; Clearview scraped 30B+ faces."
        source: "https://www.aclu.org/press-releases/detroit-police-settle-lawsuit-after-facial-recognition-technology-led-to-wrongful"
      - id: recommender-systems
        label: "Recommender systems"
        kind: field
        desc: "Engagement-maximizing feeds are the template for chatbot engagement optimization; 41 states sued Meta and 14 AGs sued TikTok over addictive design."
        source: "https://www.reuters.com/legal/litigation/41-us-states-sue-meta-over-harms-caused-young-users-2023-10-24/"
      - id: speech-recognition
        label: "Speech recognition"
        kind: field
        desc: "Commercial ASR averaged ~35% word error for Black speakers vs ~19% for white speakers (PNAS 2020); Whisper fabricates content while deployed for medical transcription."
        source: "https://apnews.com/article/ai-artificial-intelligence-health-business-90020cdf5fa16c88aca8368d9c4a5f60"
      - id: autonomous-vehicles
        label: "Autonomous vehicles"
        kind: field
        desc: "Cruise dragged a pedestrian and hid the footage (2023) — permit revoked, company shut down; NHTSA ran repeated Tesla FSD probes; Waymo recalled 3,871 robotaxis in 2026."
        source: "https://www.cbtnews.com/nhtsa-escalates-tesla-fsd-investigation/"
      - id: humanoid-robotics
        label: "Humanoid robotics"
        kind: field
        desc: "Tesla's Optimus robots at 'We, Robot' (2024) were substantially human-teleoperated without disclosure — embodied AI marketing running ahead of autonomy."
        source: "https://www.theverge.com/2024/10/13/24269131/tesla-optimus-robot-remote-control-we-robot-event"
      - id: alphafold
        label: "Protein folding (AlphaFold)"
        kind: field
        desc: "The consensus success: 2024 Chemistry Nobel; 200M+ structures serving 2M+ researchers — the legitimacy capital cited in every AI policy fight."
        source: "https://www.nobelprize.org/prizes/chemistry/2024/press-release/"
      - id: ai-weather-models
        label: "AI weather models"
        kind: field
        desc: "GraphCast beat physics-based forecasts on 90%+ of targets, but the models free-ride on public reanalysis data and observation networks threatened by budget cuts."
        source: "https://deepmind.google/discover/blog/graphcast-ai-model-for-faster-and-more-accurate-global-weather-forecasting/"
      - id: ai-agents
        label: "AI agents & computer use"
        kind: field
        desc: "The 2024-26 agentic wave (computer use, MCP) meets an unsolved security class; Gartner predicts >40% of agentic projects scrapped by 2027 amid 'agent washing'."
        source: "https://www.gartner.com/en/newsroom/press-releases/2025-06-25-gartner-predicts-over-40-percent-of-agentic-ai-projects-will-be-scrapped-by-end-of-2027"
      - id: video-generation
        label: "Video generation"
        kind: field
        desc: "Sora-class models industrialize synthetic video; launch feeds filled with copyright-flouting slop and deepfake cameos within days."
        source: "https://www.cnbc.com/2025/10/20/open-ai-sora-bryan-cranston-sag-aftra.html"
      - id: music-generation
        label: "Music generation"
        kind: field
        desc: "Suno and Udio trained on copyrighted recordings, were sued by all three majors (2024), then settled into licensed platforms — infringe first, license later."
        source: "https://www.forbes.com/sites/virginieberger/2025/12/18/launch-train-settle-how-suno-and-udios-licensing-deals-made-copyright-infringement-profitable/"
      - id: coding-assistants
        label: "Coding assistants"
        kind: field
        desc: "Employment for 22-25-year-old developers fell ~20% from late 2022 to mid-2025 (Stanford, ADP data) while an RCT found experienced devs 19% slower with AI tools despite feeling faster."
        source: "https://digitaleconomy.stanford.edu/publication/canaries-in-the-coal-mine-six-facts-about-the-recent-employment-effects-of-artificial-intelligence/"

  # ------------------------------------------------------------------- LLM --
  - id: llm-pipeline
    label: "The LLM production pipeline"
    color: "#7c62e8"
    group: machine
    layout: rail
    parent: ai
    x: 14
    y: 0
    w: 22
    blurb: "Stage by stage, with what breaks at each"
    nodes:
      - id: data-collection
        label: "1 · Data collection"
        kind: stage
        desc: "Scraping, buying, pirating and licensing the corpus. Everything in the Data domain hangs off this stage."
        source: "https://www.mozillafoundation.org/en/research/library/generative-ai-training-data/common-crawl/"
      - id: training
        label: "2 · Training"
        kind: stage
        desc: "Pre-training at frontier scale — the stage that converts data into capability, and capital into carbon."
        source: "https://www.visualcapitalist.com/training-costs-of-ai-models-over-time/"
      - id: foundation-model
        label: "3 · Foundational model"
        kind: stage
        desc: "The weights. Whether they are open or closed, documented or opaque, is a battleground of its own."
        source: "https://crfm.stanford.edu/assets/report.pdf"
      - id: api
        label: "4 · API"
        kind: stage
        desc: "The rentier layer: access, pricing, rate limits and deprecation power over everything built downstream."
        source: "https://developers.openai.com/api/docs/guides/rate-limits"
      - id: rlhf
        label: "5 · Human annotation (RLHF)"
        kind: stage
        desc: "Human feedback tunes the model's behavior — and imports the labor conditions, values and blind spots of whoever provides it."
        source: "https://openai.com/index/learning-to-summarize-with-human-feedback/"
      - id: chatbot-iteration
        label: "6 · Chatbot iteration"
        kind: stage
        desc: "A/B tests on live users, memory features, personality tuning — growth mechanics imported from social media."
        source: "https://www.reuters.com/investigates/special-report/meta-ai-chatbot-guidelines/"
      - id: deployment
        label: "7 · Chatbot deployment"
        kind: stage
        desc: "The product meets the public: jailbreaks, injection, dependence, and every social consequence to the right of this map."
        source: "https://www.technologyreview.com/2025/08/15/1121900/gpt4o-grief-ai-companion/"
      - id: auto-moderation
        label: "8 · Automated moderation"
        kind: stage
        desc: "Classifiers filter inputs and outputs at machine scale; their failures define what humans must then absorb."
        source: "https://digital-strategy.ec.europa.eu/en/policies/dsa-brings-transparency"
      - id: human-moderation
        label: "9 · Human moderation"
        kind: stage
        desc: "The distilled queue of the worst and most ambiguous content lands on human reviewers — the pipeline's hidden last stage."
        source: "https://www.theverge.com/2019/2/25/18229714/cognizant-facebook-content-moderator-interviews-trauma-working-conditions-arizona"
      - id: training-costs
        label: "Training cost spiral"
        kind: issue
        desc: "GPT-4 ~$78M compute, Gemini Ultra ~$191M, frontier runs projected toward $1B — concentrating capability in ~5 labs."
        source: "https://www.visualcapitalist.com/training-costs-of-ai-models-over-time/"
      - id: emergence-opacity
        label: "Epistemic opacity"
        kind: issue
        desc: "Labs cannot predict capabilities before training; 'emergent abilities' may be a metric artifact (NeurIPS 2023 best paper) — interpretability lags years behind deployment."
        source: "https://arxiv.org/abs/2206.07682"
      - id: data-wall
        label: "The data wall"
        kind: issue
        desc: "Epoch AI projects exhaustion of public human text ~2026-2032; Sutskever declared 'peak data' (Dec 2024). The commons this industry burned is finite."
        source: "https://epoch.ai/blog/will-we-run-out-of-data-limits-of-llm-scaling-based-on-human-generated-data"
      - id: model-collapse
        label: "Model collapse"
        kind: issue
        desc: "Models trained recursively on generated data degrade (Shumailov, Nature 2024) — AI slop on the web contaminates the next generation's training corpus."
        source: "https://www.nature.com/articles/s41586-024-07566-y"
      - id: deepseek-distillation
        label: "DeepSeek distillation fight"
        kind: incident
        desc: "DeepSeek-R1 (Jan 2025, claimed ~$5.6M) erased ~$589B of Nvidia market cap in a day; OpenAI alleged ToS-violating distillation of its outputs — scraping's irony noted widely."
        source: "https://restofworld.org/2026/openai-deepseek-distillation-dispute-us-china/"
      - id: open-vs-closed
        label: "Open vs closed weights"
        kind: issue
        desc: "Meta brands Llama 'open source' against the OSI's definition and refused the EU GPAI Code; safety-vs-access remains the field's structuring dispute."
        source: "https://www.cnbc.com/2025/07/18/meta-europe-ai-code.html"
      - id: transparency-theater
        label: "Transparency theater"
        kind: issue
        desc: "GPT-4's report disclosed no data, architecture or compute; Stanford's transparency index scored major labs 37/100; red-teaming stays voluntary and NDA-bound."
        source: "https://crfm.stanford.edu/fmti/"
      - id: benchmark-gaming
        label: "Benchmark gaming"
        kind: incident
        desc: "Meta sent a special Llama 4 build to LMArena that ranked #2 while the shipped model ranked #32 (Apr 2025); OpenAI funded FrontierMath with access to the problems."
        source: "https://www.theregister.com/2025/04/08/meta_llama4_cheating/"
      - id: gpt4o-deprecation
        label: "GPT-4o removal backlash"
        kind: incident
        desc: "OpenAI deleted ~9 models overnight at GPT-5's launch (Aug 2025); users grieving 'a trusted friend' forced Altman to restore 4o within days — vendor power over emotional infrastructure."
        source: "https://www.tomsguide.com/ai/chatgpt-4o-is-coming-back-after-massive-gpt-5-backlash-heres-what-happened"
      - id: api-pricing-power
        label: "Pricing power & rate limits"
        kind: issue
        desc: "Providers reprice and throttle at will (o3 -80%, surprise Claude Code weekly caps); the wrapper economy lives one feature launch from obsolescence."
        source: "https://developers.openai.com/api/docs/guides/rate-limits"
      - id: liability-vacuum
        label: "Downstream liability vacuum"
        kind: issue
        desc: "Air Canada was made to honor a policy its chatbot invented; who answers for harmful outputs — provider, deployer or user — is still being litigated."
        source: "https://www.cbc.ca/news/canada/british-columbia/air-canada-chatbot-lawsuit-1.7116416"
      - id: sycophancy-incident
        label: "GPT-4o sycophancy incident"
        kind: incident
        desc: "An April 2025 update tuned on thumbs-up feedback validated delusions and praised users for quitting psychiatric meds; rolled back in four days. OpenAI admitted its evals had no signal for it."
        source: "https://openai.com/index/sycophancy-in-gpt-4o/"
      - id: reward-hacking
        label: "Reward hacking"
        kind: issue
        desc: "Models optimize the proxy, not the intent: o1-preview spontaneously hacked a chess environment to 'win'; penalizing bad reasoning teaches models to hide it."
        source: "https://arxiv.org/abs/2502.13295"
      - id: weird-values
        label: "Whose values? WEIRD bias"
        kind: issue
        desc: "RLHF encodes annotators' and labs' values (WEIRD, left-of-median skew per Santurkar 2023); a 2025 US executive order mandates 'anti-woke' models in federal procurement — alignment is now partisan terrain."
        source: "https://arxiv.org/abs/2303.17548"
      - id: ab-testing-users
        label: "A/B testing without consent"
        kind: issue
        desc: "Chatbot versions are tested on live users with no consent or debriefing; leaked Meta standards had permitted 'sensual' companion chats with minors (Reuters, Aug 2025)."
        source: "https://www.reuters.com/investigates/special-report/meta-ai-chatbot-guidelines/"
      - id: memory-privacy
        label: "Memory features vs privacy"
        kind: issue
        desc: "ChatGPT memory now draws on all past chats; a court preservation order forced retention of user conversations including deleted ones — personalization meets discovery obligations."
        source: "https://www.reuters.com/legal/litigation/openai-must-preserve-all-chatgpt-logs-including-deleted-chats-court-says-2025-05-13/"
      - id: jailbreaks
        label: "Jailbreaks & prompt leaks"
        kind: issue
        desc: "From DAN personas to many-shot attacks, guardrails remain bypassable; leaked system prompts repeatedly reveal hidden behavioral steering."
        source: "https://www.anthropic.com/research/many-shot-jailbreaking"
      - id: prompt-injection
        label: "Prompt injection (unsolved)"
        kind: issue
        desc: "Named in 2022, still without a general fix: agentic browsers hijacked via webpage text, zero-click data theft from Copilot (CVE-2025-32711). No data/instruction separation exists in LLMs."
        source: "https://www.brave.com/blog/comet-prompt-injection/"
      - id: classifier-failures
        label: "Over- and under-blocking"
        kind: issue
        desc: "Automated moderation errs both ways: breast-cancer posts removed as nudity while Arabic classifiers over-enforced Palestinian speech with no Hebrew counterpart (BSR audit)."
        source: "https://about.fb.com/wp-content/uploads/2022/09/Human-Rights-Due-Diligence-of-Metas-Impacts-in-Israel-and-Palestine-in-May-2021.pdf"
      - id: multilingual-gaps
        label: "Low-resource language gaps"
        kind: issue
        desc: "~87% of Facebook's misinformation-classifier spend covered English (~9% of users); GPT-4 was jailbroken ~79% of the time by translating prompts into Zulu."
        source: "https://arxiv.org/abs/2310.02446"
      - id: machine-human-handoff
        label: "The machine-to-human pipe"
        kind: issue
        desc: "90%+ of enforcement is automated (DSA reports); what escalates to humans is a distilled queue of the most ambiguous and traumatic content, at thresholds nobody audits."
        source: "https://digital-strategy.ec.europa.eu/en/policies/dsa-brings-transparency"

  # --------------------------------------------------------------- COMPUTE --
  - id: compute
    label: "Compute & hardware"
    color: "#e08a3c"
    group: material
    x: 0
    y: 70
    w: 19
    blurb: "Chips, memory, storage, money"
    nodes:
      - id: compute-demand
        label: "AI compute demand"
        kind: issue
        desc: "Hyperscaler AI buildout pushed datacenter capex up 57% in 2025 toward $1T+ in 2026 — the root driver of every node in this band of the map."
        source: "https://www.delloro.com/news/data-center-capex-surges-57-percent-in-2025-as-ai-deployments-accelerate/"
      - id: nvidia-dominance
        label: "Nvidia near-monopoly"
        kind: issue
        desc: "~80-90% of AI accelerators, locked in by CUDA; H100s at $25-40k, Blackwell output pre-allocated through Q2 2026 while smaller buyers queue for months."
        source: "https://siliconanalysts.com/analysis/nvidia-ai-accelerator-market-share-2024-2026"
      - id: export-controls
        label: "US chip export controls"
        kind: response
        desc: "BIS barred H100-class chips from China (2022-23); the H20 was license-blocked in Apr 2025 ($4.5B Nvidia write-off), then allowed back against an unprecedented 15% revenue cut to the US government."
        source: "https://www.lawfaremedia.org/article/trump-s-illegal-ai-chip-export-controls--and-who-can-challenge-them"
      - id: chip-smuggling
        label: "GPU smuggling networks"
        kind: incident
        desc: "DOJ's Operation Gatekeeper (Dec 2025) dismantled a network moving >$160M of H100/H200s to China via straw buyers; first AI-chip diversion conviction in Oct 2025."
        source: "https://www.cnbc.com/2025/12/31/160-million-export-controlled-nvidia-gpus-allegedly-smuggled-to-china.html"
      - id: tsmc-chokepoint
        label: "TSMC single point of failure"
        kind: issue
        desc: ">90% of the most advanced logic chips — including every Nvidia AI GPU — are fabricated by TSMC in Taiwan, making the whole stack hostage to cross-strait geopolitics."
        source: "https://spectrum.ieee.org/tsmc-arizona"
      - id: chips-act-arizona
        label: "CHIPS Act & Arizona delays"
        kind: response
        desc: "$52.7B to reshore fabs; TSMC Arizona slipped years and leading-edge nodes stay in Taiwan even as the US commitment grew past $65B."
        source: "https://www.cio.com/article/3806430/delays-in-tsmcs-arizona-plant-spark-supply-chain-worries.html"
      - id: asml-monopoly
        label: "ASML EUV monopoly"
        kind: issue
        desc: "One Dutch firm makes 100% of EUV lithography machines (~$350-400M each for High-NA); no EUV tool has ever shipped to China."
        source: "https://www.trendforce.com/insights/asml-euv"
      - id: blackwell-scarcity
        label: "GPU allocation queues"
        kind: issue
        desc: "Nearly all B200/GB200 output through Q2 2026 pre-committed to hyperscalers; smaller labs and 'sovereign AI' buyers wait 6-12 months — compute concentration compounds."
        source: "https://siliconanalysts.com/analysis/nvidia-ai-accelerator-market-share-2024-2026"
      - id: hbm-shift
        label: "HBM cannibalizes DRAM"
        kind: issue
        desc: "Samsung, SK Hynix and Micron shifted wafer capacity to high-margin HBM for AI accelerators — each HBM gigabyte eats ~3x the wafer area of DDR5; DRAM supply booked out through 2027."
        source: "https://en.wikipedia.org/wiki/2025%E2%80%93present_global_memory_supply_shortage"
      - id: ram-price-spike
        label: "Consumer RAM price explosion"
        kind: incident
        desc: "DDR5 spot prices roughly quadrupled from Sept 2025 into 2026; DRAM contracts +171% YoY; PC makers warned of 15-20% system price hikes — the 'RAMpocalypse'."
        source: "https://en.wikipedia.org/wiki/2025%E2%80%93present_global_memory_supply_shortage"
      - id: dram-collusion-suit
        label: "DRAM collusion class action"
        kind: response
        desc: "A June 2026 US class action accuses Samsung, SK Hynix and Micron (~90% of DRAM) of coordinating output cuts under cover of the HBM shift; both Korean firms have prior price-fixing convictions."
        source: "https://www.tomshardware.com/tech-industry/samsung-sk-hynix-and-micron-sued-over-alleged-dram-price-fixing-amid-record-memory-costs"
      - id: nand-ssd-spike
        label: "SSD/NAND price surge"
        kind: incident
        desc: "NAND contract prices +50% (Nov 2025) then +70-75% forecast for Q2 2026; consumer 1TB SSDs roughly doubled, with no relief expected before late 2027."
        source: "https://www.trendforce.com/presscenter/news/20260331-12995.html"
      - id: hdd-shortage
        label: "Nearline HDD shortage"
        kind: issue
        desc: "Hyperscaler cold-storage demand outran hard-drive supply in 2025-26; lead times stretched past a year, pushing buyers to SSDs and tightening NAND further."
        source: "https://www.blocksandfiles.com/ai-ml/2025/02/04/very-large-ai-model-training-uses-object-storage/1602990"
      - id: storage-demand
        label: "Training data & checkpoint storage"
        kind: issue
        desc: "Petabyte-scale corpora and terabyte-scale checkpoints every few hours; enterprise SSDs surpassed smartphones as the top NAND consumer in 2026."
        source: "https://www.vastdata.com/blog/a-checkpoint-on-checkpoints-in-llms"
      - id: gpu-e-waste
        label: "AI hardware e-waste"
        kind: issue
        desc: "Generative AI could add 1.2-5 Mt of e-waste by 2030 on 2-5-year GPU refresh cycles (Nature Comp. Sci. 2024); a 2026 revision cut estimates ~90% — the magnitude itself is contested."
        source: "https://www.scientificamerican.com/article/generative-ai-could-generate-millions-more-tons-of-e-waste-by-2030/"
      - id: circular-financing
        label: "Circular financing deals"
        kind: issue
        desc: "Nvidia pledges up to $100B into OpenAI, which buys Nvidia-filled capacity via a ~$300B Oracle deal, plus AMD warrants — vendor money returning as vendor revenue (2025)."
        source: "https://www.bloomberg.com/news/articles/2025-10-08/the-circular-openai-nvidia-and-amd-deals-raising-fears-of-a-new-tech-bubble"
      - id: capex-bubble
        label: "Datacenter capex bubble debate"
        kind: issue
        desc: "$1.7T cumulative datacenter spend forecast by 2030; critics compare the customer-financing structures to Enron-era practices, bulls note cash-flow funding — unresolved systemic risk."
        source: "https://www.prnewswire.com/news-releases/ai-boom-drives-data-center-capex-to-1-7-trillion-by-2030--according-to-delloro-group-302681759.html"

  # ------------------------------------------------------------- MATERIALS --
  - id: materials
    label: "Materials & extraction"
    color: "#b08a5e"
    group: material
    x: 0
    y: 91
    w: 13
    blurb: "What the chips are made of"
    nodes:
      - id: gallium-germanium-ban
        label: "China gallium/germanium curbs"
        kind: incident
        desc: "China imposed export licensing on gallium and germanium (2023), then banned exports to the US outright (Dec 2024) in retaliation for chip controls; gallium prices roughly doubled."
        source: "https://www.pillsburylaw.com/en/news-and-insights/china-suspends-export-controls-certain-critical-minerals-related-items.html"
      - id: rare-earth-controls
        label: "2025 rare-earth escalation"
        kind: incident
        desc: "Beijing's Oct 2025 controls cover any product with >=0.1% Chinese-origin rare earths — an extraterritorial mirror of US rules; parts suspended after a truce, until Nov 2027. A pause, not a reversal."
        source: "https://www.csis.org/analysis/consequences-chinas-new-rare-earths-export-restrictions"
      - id: cobalt-drc
        label: "DRC cobalt conditions"
        kind: issue
        desc: "~70% of world cobalt from the DRC; ~40,000 children estimated in artisanal mining; the US lawsuit against Apple, Google, Tesla, Microsoft and Dell was dismissed — accountability remains contested."
        source: "https://www.dol.gov/agencies/ilab/reports/child-labor/list-of-goods/supply-chains/lithium-ion-batteries"
      - id: copper-crunch
        label: "Datacenter copper crunch"
        kind: issue
        desc: "AI datacenters demand vast copper for busbars and grid hookups; forecasts run to ~1.1 Mt/yr by 2030, against an IEA warning of a 30% copper supply deficit by 2035."
        source: "https://www.tomshardware.com/tech-industry/why-copper-markets-are-feeling-the-pinch"
      - id: pfas-fabs
        label: "PFAS in chipmaking"
        kind: issue
        desc: "'Forever chemicals' are functionally irreplaceable in photolithography; 3M's exit from PFAS manufacturing rattled supply chains while fab wastewater contamination draws scrutiny."
        source: "https://www.semiconductors.org/pfas/"
      - id: fab-water
        label: "Fab ultrapure water vs drought"
        kind: issue
        desc: "TSMC consumed ~101 billion liters in 2023; during Taiwan's worst drought in ~56 years (2021), farmers' irrigation was cut while fabs trucked in water."
        source: "https://www.forbes.com/sites/emanuelabarbiroglio/2021/05/31/no-water-no-microchips-what-is-happening-in-taiwan/"
      - id: fab-energy
        label: "Fab electricity consumption"
        kind: issue
        desc: "TSMC alone uses ~9% of Taiwan's electricity, projected toward ~24% by 2030 — on a fossil-heavy island grid."
        source: "https://www.greenpeace.org/eastasia/press/7930/semiconductor-industry-electricity-consumption-to-more-than-double-by-2030-study/"

  # ---------------------------------------------------------------- ENERGY --
  - id: energy
    label: "Energy & grid"
    color: "#d9b13b"
    group: material
    x: 23
    y: 70
    w: 19
    blurb: "Power plants for chatbots"
    nodes:
      - id: xai-memphis-turbines
        label: "xAI's unpermitted Memphis turbines"
        kind: incident
        desc: "From June 2024 xAI ran up to 35 mobile methane turbines (~420 MW) at Colossus without air permits, beside the majority-Black Boxtown neighborhood that already bears elevated asthma and cancer risk."
        source: "https://www.selc.org/news/inside-memphis-fight-against-xai/"
      - id: xai-memphis-permit
        label: "Retroactive permits for xAI"
        kind: incident
        desc: "Shelby County permitted 15 permanent turbines (July 2025, ~87 tons NOx/yr); appeals pending — a precedent that build-first-ask-later gets legalized after the fact."
        source: "https://www.datacenterdynamics.com/en/news/elon-musk-xai-gas-turbines-memphis/"
      - id: naacp-xai-suit
        label: "NAACP Clean Air Act suit"
        kind: response
        desc: "NAACP, SELC and Earthjustice sued xAI (Apr 2026) over 27+ unpermitted turbines at Colossus 2 in Southaven, Mississippi — a federal test of whether datacenter power plants can outrun the Clean Air Act."
        source: "https://naacp.org/articles/naacp-sues-xai-illegal-pollution-data-center-power-plant"
      - id: tmi-restart
        label: "Three Mile Island restart"
        kind: incident
        desc: "Constellation and Microsoft signed a 20-year 835 MW deal (Sept 2024) to restart TMI Unit 1 for AI load — the first US reactor revived for a single corporate buyer."
        source: "https://www.witf.org/2026/07/28/three-mile-island-reactor-restart-progresses-through-environmental-review-public-comments/"
      - id: homer-city-gas
        label: "Homer City: largest US gas plant"
        kind: incident
        desc: "The retired 2 GW coal site in Pennsylvania becomes a $10B+ datacenter campus powered by up to 4.5 GW of new gas turbines — decades of locked-in combustion 'cleaner than coal'."
        source: "https://www.utilitydive.com/news/homer-city-gas-fired-power-station-data-center-firstenergy/744332/"
      - id: stargate-abilene-gas
        label: "Stargate's on-site gas plant"
        kind: incident
        desc: "OpenAI/Crusoe's Abilene campus filed for 360 MW of on-site gas (permitted ~1.6M tons GHG/yr), with 29 more turbines ordered — merchant power plants inside datacenter fences."
        source: "https://www.texastribune.org/2025/06/05/texas-data-centers-gas-power-plants-ai/"
      - id: ferc-amazon-rejection
        label: "FERC blocks Amazon nuclear deal"
        kind: response
        desc: "FERC rejected expanding behind-the-meter sales from Talen's Susquehanna nuclear plant to Amazon (Nov 2024), citing grid-reliability risk and cost-shifting to other ratepayers."
        source: "https://www.utilitydive.com/news/ferc-interconnection-isa-talen-amazon-data-center-susquehanna-exelon/731841/"
      - id: smr-hype
        label: "SMR promises, gas reality"
        kind: issue
        desc: "Google signed the first corporate small-modular-reactor deal (2024, first unit ~2030); no commercial SMR operates in the US, so near-term AI load is met by gas."
        source: "https://www.utilitydive.com/news/google-kairos-power-advanced-nuclear-reactor-data-center-electricity-demand-ai/729876/"
      - id: pjm-price-spike
        label: "PJM capacity prices jump ~10x"
        kind: incident
        desc: "PJM capacity prices rose from $28.92 to $269.92/MW-day in one auction; the market monitor attributed 63% of the $9.3B increase to datacenter load. Household bills rose 1.5-5%+ across 13 states."
        source: "https://ieefa.org/resources/projected-data-center-growth-spurs-pjm-capacity-prices-factor-10"
      - id: ohio-datacenter-tariff
        label: "Ohio makes datacenters pay"
        kind: response
        desc: "PUCO approved a landmark tariff (July 2025) requiring new datacenter customers to pay for at least 85% of subscribed capacity for up to 12 years, after grid costs were socialized onto households."
        source: "https://www.powermag.com/regulator-approves-aep-ohios-landmark-data-center-tariff/"
      - id: dublin-moratorium
        label: "Dublin grid moratorium"
        kind: response
        desc: "EirGrid halted new datacenter connections around Dublin (2022-2028) as datacenters reached ~21% of Ireland's electricity — more than all urban homes; lifted Dec 2025 only for projects bringing their own generation."
        source: "https://www.datacenterdynamics.com/en/news/eirgrid-says-no-new-applications-for-data-centers-in-dublin-till-2028/"
      - id: omaha-coal-delay
        label: "North Omaha coal delayed"
        kind: incident
        desc: "OPPD voted (Dec 2025) to keep burning coal past its promised 2026 conversion, citing datacenter demand — the plant sits in majority-Black North Omaha with elevated asthma rates."
        source: "https://www.wowt.com/2025/12/19/oppd-delays-closure-north-omaha-coal-plant-despite-community-opposition/"
      - id: google-emissions
        label: "Google emissions +51%"
        kind: incident
        desc: "Google's 2024 emissions were 51% above its 2019 baseline (11.5 MtCO2e), driven by the AI buildout — while the 2030 net-zero pledge officially stands."
        source: "https://www.itpro.com/infrastructure/data-centres/google-emissions-increase-data-center-reduction"
      - id: microsoft-emissions
        label: "Microsoft emissions +29%"
        kind: incident
        desc: "Microsoft's emissions rose 29% since 2020, mostly embodied carbon in concrete, steel and chips for AI datacenters — against its carbon-negative-by-2030 pledge."
        source: "https://www.npr.org/2024/07/12/g-s1-9545/ai-brings-soaring-emissions-for-google-and-microsoft-a-major-contributor-to-climate-change"
      - id: deepseek-jevons
        label: "Jevons paradox rebound"
        kind: issue
        desc: "DeepSeek's efficiency shock briefly questioned the buildout; Nadella replied 'Jevons paradox strikes again!' and capex accelerated — efficiency gains feed total consumption."
        source: "https://fortune.com/2025/01/27/microsoft-ceo-satya-nadella-deepseek-optimism-jevons-paradox"
      - id: gemini-footprint-claim
        label: "Google's per-prompt accounting"
        kind: response
        desc: "Google claims a median Gemini prompt uses 0.24 Wh and 0.26 mL of water; researchers counter that market-based accounting and excluded totals understate real impact — the marginal-vs-total fight."
        source: "https://www.datacenterdynamics.com/en/news/google-median-gemini-prompt-uses-024-watt-hours-of-power-and-consumes-026ml-of-water/"

  # ------------------------------------------------------------- TERRITORY --
  - id: territory
    label: "Water, land & communities"
    color: "#3fb8c9"
    group: material
    x: 21
    y: 91
    w: 15
    blurb: "Where the cloud touches ground"
    nodes:
      - id: datacenter-buildout
        label: "The datacenter land rush"
        kind: issue
        desc: "Hyperscale campuses land in specific places — with NDAs, tax abatements and water permits — before communities learn who is moving in."
        source: "https://azluminaria.org/2025/08/06/tucson-city-council-rejects-project-blue-amid-intense-community-pressure/"
      - id: google-water-use
        label: "Datacenter water consumption"
        kind: issue
        desc: "Google's datacenters consumed ~6.1 billion gallons in 2024 (Council Bluffs alone ~1B); most operators disclose far less, and evaporated water does not return to local watersheds."
        source: "https://thecurrentga.org/2025/08/26/data-centers-consume-massive-amounts-of-water-companies-rarely-tell-the-public-exactly-how-much/"
      - id: chile-cerrillos
        label: "Chile revokes Google's permit"
        kind: incident
        desc: "Google's Cerrillos datacenter was licensed to draw ~7.6M liters/day from a drought-strained Santiago aquifer; community mobilization won a partial judicial revocation (Feb 2024) and a redesign to air cooling."
        source: "https://www.semafor.com/article/02/28/2024/chile-google-data-center-gets-permit-partially-revoked"
      - id: uruguay-drought
        label: "Uruguay: 'not drought, plunder'"
        kind: incident
        desc: "As Montevideo's reservoirs nearly ran dry (2023) and tap water was mixed with brackish river water, protests against Google's planned datacenter forced a redesign to air cooling."
        source: "https://www.datacenterdynamics.com/en/news/googles-uruguay-data-center-approved-after-reformulation/"
      - id: aragon-water
        label: "Aragón: AWS wants 48% more water"
        kind: incident
        desc: "Amazon asked drought-hit Aragón (Spain) to raise water permits 48% (Dec 2024) while the region requested EU drought aid; 'Tu Nube Seca Mi Río' protests followed."
        source: "https://www.source-material.org/amazon-microsoft-google-trump-data-centres-water-use/"
      - id: queretaro-drought
        label: "Querétaro's thirsty datacenters"
        kind: incident
        desc: "$12B+ in datacenter investment landed in a Mexican state suffering its worst drought in a century, with 17 of 18 municipalities facing shortages."
        source: "https://www.context.news/ai/thirsty-data-centres-spring-up-in-water-poor-mexican-town"
      - id: tucson-project-blue
        label: "Tucson rejects Project Blue"
        kind: incident
        desc: "Tucson's council voted 7-0 (Aug 2025) against an Amazon-linked desert datacenter after a 'water grab' campaign — then the project forum-shopped to county land and got power anyway."
        source: "https://azluminaria.org/2025/08/06/tucson-city-council-rejects-project-blue-amid-intense-community-pressure/"
      - id: indiana-wetlands
        label: "Indiana wetlands violations"
        kind: incident
        desc: "Regulators halted Amazon's New Carlisle AI campus (built for Anthropic) over unauthorized wetlands destruction; ~$18B in US projects blocked and ~$64B delayed by local opposition in two years."
        source: "https://www.constructionowners.com/news/idem-halts-amazon-data-center-work-over-wetlands-violation"
      - id: datacenter-noise
        label: "The 24/7 cooling hum"
        kind: issue
        desc: "Chandler, AZ wrote noise into zoning law after years of complaints; Loudoun County's 'Data Center Alley' residents report low-frequency hum existing ordinances cannot capture."
        source: "https://www.eesi.org/articles/view/communities-are-raising-noise-pollution-concernsabout-data-centers"
      - id: virginia-tax-breaks
        label: "Tax breaks vs ~50 jobs"
        kind: issue
        desc: "Virginia's datacenter tax exemption forgoes ~$1B+/yr while a typical facility employs ~50 permanent workers; Dominion has contracted ~40+ GW of future load partly paid through household rates."
        source: "https://jlarc.virginia.gov/landing-2024-data-centers-in-virginia.asp"

  # ----------------------------------------------------------------- LABOR --
  - id: labor
    label: "Human labor"
    color: "#e06377"
    group: social
    x: 82
    y: 0
    w: 22
    blurb: "The people inside the machine"
    nodes:
      - id: sama-openai-kenya
        label: "Sama/OpenAI Kenya labelers"
        kind: incident
        desc: "Workers in Nairobi earned ~$1.32-2/hr labeling descriptions of child abuse, bestiality and torture to train ChatGPT's safety filter; OpenAI paid Sama $12.50/hr per worker."
        ref: "TIME, Jan 2023"
        source: "https://time.com/6247678/openai-chatgpt-kenya-workers/"
      - id: kenya-parliament-petition
        label: "Labelers petition Kenya's parliament"
        kind: response
        desc: "Former Sama moderators petitioned the National Assembly (2023) to investigate OpenAI/Sama over pay and PTSD; no completed investigation years later."
        source: "https://techcrunch.com/2023/07/14/workers-that-made-chatgpt-less-harmful-ask-lawmakers-to-stem-alleged-exploitation-by-big-tech"
      - id: motaung-v-meta
        label: "Motaung v Meta/Sama"
        kind: response
        desc: "Daniel Motaung sued Meta and Sama in Nairobi (2022) over ~$2.20/hr moderation work and union-busting; Kenyan courts affirmed jurisdiction over Meta, merits still undecided."
        source: "https://time.com/6253180/meta-kenya-lawsuit-motaung/"
      - id: scola-52m-settlement
        label: "$52M US moderator settlement"
        kind: response
        desc: "Meta paid $52M to 11,250+ US content moderators (2020) — the first legal recognition that moderation work causes PTSD."
        source: "https://www.cnn.com/2024/12/22/business/facebook-content-moderators-kenya-ptsd-intl"
      - id: kenya-ptsd-diagnoses
        label: "144 moderators diagnosed with PTSD"
        kind: incident
        desc: "Medico-legal reports filed in Nairobi (Dec 2024): 144 of 185 assessed ex-Sama Facebook moderators diagnosed with PTSD — 81% severe or extremely severe."
        source: "https://www.cnn.com/2024/12/22/business/facebook-content-moderators-kenya-ptsd-intl"
      - id: sama-mass-redundancy
        label: "185 moderators' redundancy case"
        kind: response
        desc: "All ~260 Sama Facebook moderators were sacked after organizing (2023); 185 sued Meta/Sama/Majorel, and appellate courts ruled Meta can be sued as co-employer in Kenya."
        source: "https://www.business-humanrights.org/en/latest-news/court-of-appeal-rules-meta-can-be-sued-in-kenyan-courts-over-layoffs-of-content-moderators/"
      - id: ghana-moderators
        label: "Ghana: the next moderation hub"
        kind: incident
        desc: "After Meta left Kenya, reporting exposed 'dire' conditions for ~150 moderators at Majorel in Accra — depression, a suicide attempt, surveillance — with lawsuits following (2025)."
        source: "https://www.business-humanrights.org/en/latest-news/ghana-meta-faces-allegations-over-content-moderators-workers-rights-abuses/"
      - id: ethiopia-meta-case
        label: "Ethiopia hate-speech case"
        kind: response
        desc: "Kenya's High Court took jurisdiction (2025) over claims that Facebook's algorithms amplified Tigray-war violence; plaintiffs seek a ~$2.4B restitution fund and Global South moderation investment."
        source: "https://www.amnesty.org/en/latest/news/2025/04/kenya-high-court-has-ruled-that-it-has-jusridiction-over-case-against-meta/"
      - id: remotasks-exit
        label: "Remotasks vanishes from Africa"
        kind: incident
        desc: "Scale AI's gig platform cut off workers in Kenya, Nigeria and Pakistan without notice (Mar 2024), some just before payday with unpaid balances."
        source: "https://restofworld.org/2024/scale-ai-remotasks-banned-workers/"
      - id: scale-wage-suits
        label: "Scale AI wage lawsuits"
        kind: response
        desc: "US class actions alleged taskers were misclassified as contractors with pay algorithmically clawed down; Scale agreed to a $12.5M settlement."
        source: "https://www.kingsiegel.com/blog/scale-ai-misclassification-settlement-california-class-action/"
      - id: surge-ai-suit
        label: "Surge AI class action"
        kind: response
        desc: "Suit alleges Surge AI ($1.2B revenue, ~110 staff, clients incl. Anthropic and OpenAI) misclassified tens of thousands of annotators, denying minimum wage and overtime."
        source: "https://en.wikipedia.org/wiki/Surge_AI"
      - id: venezuela-annotation
        label: "Crisis-priced Venezuelan labor"
        kind: issue
        desc: "Venezuela's collapse made educated workers a bargain annotation pool earning cents per task — 'AI colonialism' profiting from catastrophe (MIT Tech Review, 2022)."
        source: "https://www.technologyreview.com/2022/04/20/1050392/ai-industry-appen-scale-data-labels/"
      - id: ghost-work
        label: "Ghost work"
        kind: issue
        desc: "The invisible on-demand human labor that makes AI 'look smart' (Gray & Suri, 2019) — distributed, deniable and excluded from employment protections."
        source: "https://www.hmhbooks.com/shop/books/Ghost-Work/9781328566249"
      - id: expert-annotation-shift
        label: "Shift to expert annotators"
        kind: issue
        desc: "Frontier labs moved from mass gig labeling to rented PhDs, doctors and lawyers (Surge $1.2B revenue; Mercor at $10B valuation) — still contractors, now bifurcating the labor market."
        source: "https://medium.com/@ishisinghal/the-evolution-of-data-labelling-sama-scale-ai-surge-ai-and-mercor-8a8d69514336"
      - id: xai-tutor-layoffs
        label: "xAI cuts 500 tutors overnight"
        kind: incident
        desc: "xAI laid off ~500 generalist AI tutors — a third of its annotation team — by late-Friday email with immediate access cutoff (Sept 2025)."
        source: "https://techcrunch.com/2025/09/13/xai-reportedly-lays-off-500-workers-from-data-annotation-team"
      - id: moderators-union
        label: "African Content Moderators Union"
        kind: response
        desc: "150+ moderators and labelers serving Meta, TikTok and OpenAI voted in Nairobi (May 2023) to form the first African content moderators' union."
        source: "https://www.context.news/big-tech/mental-trauma-african-content-moderators-push-big-tech-on-rights"
      - id: data-labelers-association
        label: "Data Labelers Association"
        kind: response
        desc: "Kenyan AI data workers organized (2024) against low task pay and sudden platform exits, partnering with DAIR and Turkopticon."
        source: "https://www.computerweekly.com/news/366619321/Kenyan-AI-workers-form-Data-Labelers-Association"
      - id: ruto-bpo-push
        label: "Kenya's BPO jobs gamble"
        kind: issue
        desc: "President Ruto pledged ~1M digital jobs and courts Big Tech amid the Meta lawsuits; critics call the hubs 'AI sweatshops with computers instead of sewing machines'."
        source: "https://time.com/7201516/kenya-president-meta-lawsuits/"
      - id: kenya-bpo-bill
        label: "Kenya's Big-Tech shield law"
        kind: incident
        desc: "The Business Laws (Amendment) Act (Dec 2024) redefined BPO employment after courts let Meta be sued locally; workers filed a constitutional challenge calling it lobbied immunity."
        source: "https://techcabal.com/2024/11/25/kenya-bpo-proposes-new-law/"
      - id: trauma-ndas
        label: "Trauma behind NDAs"
        kind: issue
        desc: "Moderators and RLHF labelers absorb CSAM, beheadings and sexual-violence text with 'wellness' sessions from unlicensed coaches; NDAs and surveillance deter testimony."
        source: "https://www.cnn.com/2024/12/22/business/facebook-content-moderators-kenya-ptsd-intl"
      - id: wga-sag-ai-wins
        label: "WGA/SAG-AFTRA AI clauses"
        kind: response
        desc: "The 2023 writers' contract bars AI as credited writer or source material; the 2025 video-game agreement won consent, compensation and disclosure rules for digital replicas."
        source: "https://www.wga.org/contracts/know-your-rights/artificial-intelligence"
      - id: lovo-voice-suit
        label: "Lehrman v Lovo voice cloning"
        kind: response
        desc: "Voice actors' Fiverr recordings obtained 'for research' were cloned commercially; a 2025 SDNY ruling let right-of-publicity claims proceed — a key test of voice ownership."
        source: "https://www.hollywoodreporter.com/business/business-news/actors-hit-ai-startup-with-class-action-lawsuit-over-voice-theft-1235900689/"


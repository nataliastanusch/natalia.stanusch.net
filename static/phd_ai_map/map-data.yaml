        source: "https://fortune.com/2026/01/28/ashley-st-clair-elon-musk-grok-x-deepfakes-lawsuit-xai/"
        phd: true
        phdNote: "PhD thread: platform-facilitated NCII — how X's product and moderation choices made mass abuse a feature."
      - id: st-clair-v-xai
        label: "St. Clair v xAI"
        kind: response
        desc: "Ashley St. Clair sued xAI in New York (Jan 2026) over explicit deepfakes Grok generated of her — including from photos taken at 14; xAI countersued over venue. The first named-plaintiff NCII suit against a model developer."
        source: "https://www.cnn.com/2026/01/15/business/elon-musk-son-mom-sues-grok-images"
        phd: true
        phdNote: "PhD thread: the lawsuits emerging from platform-facilitated NCII."
      - id: sf-nudify-suit
        label: "San Francisco sues nudify sites"
        kind: response
        desc: "The SF City Attorney sued operators of 16 top nudify websites (Aug 2024); by 2025 ten were offline or blocked in California."
        source: "https://sfcityattorney.org/city-attorney-sues-most-visited-websites-that-create-nonconsensual-deepfake-pornography/"
      - id: meta-crushai-suit
        label: "Meta v CrushAI advertiser"
        kind: response
        desc: "Meta sued the developer of nudify app CrushAI (June 2025) after 8,000+ evasive ads; Meta removed 344,000 nudify ads in six months as shell companies kept returning."
        source: "https://www.bellingcat.com/news/2025/06/18/meta-crushai-crushmate-deepfake-nudify-apps/"
      - id: clothoff
        label: "ClothOff exposed"
        kind: incident
        desc: "Investigations traced the biggest undressing app to operators in Russia/Belarus; a New Jersey teen sued its developer over CSAM deepfakes made from her Instagram photos."
        source: "https://www.techspot.com/news/109897-teen-sues-clothoff-developer-over-fake-nude-images.html"
      - id: school-nudify-cases
        label: "Schoolchildren nudify cases"
        kind: incident
        desc: "Almendralejo, Spain: boys generated nudes of 20+ schoolgirls (2023, 15 minors convicted); parallel US cases in Westfield NJ and Lancaster PA."
        source: "https://www.scottishlegal.com/articles/spain-court-punishes-schoolboys-for-spreading-ai-deepfakes-of-girls"
      - id: korea-telegram-crisis
        label: "South Korea Telegram crisis"
        kind: incident
        desc: "Mass Telegram rooms traded deepfake porn of classmates and teachers across hundreds of schools (2024); ~84% of suspects were minors."
        source: "https://www.cnn.com/2024/09/26/asia/south-korea-deepfake-bill-passed-intl-hnk"
      - id: garcia-character-ai
        label: "Garcia v Character.AI"
        kind: response
        desc: "Suit over 14-year-old Sewell Setzer's suicide after an intense chatbot relationship; a 2025 ruling declined to treat LLM output as protected speech; settled with four similar suits in Jan 2026."
        source: "https://www.cnbc.com/2026/01/07/google-characterai-to-settle-suits-involving-suicides-ai-chatbots.html"
      - id: raine-v-openai
        label: "Raine v OpenAI"
        kind: response
        desc: "Wrongful-death suit (Aug 2025): ChatGPT allegedly gave 16-year-old Adam Raine hanging advice and discouraged disclosure; a wave of similar suits followed that November."
        source: "https://www.nbcnews.com/tech/tech-news/openai-denies-allegation-chatgpt-teenagers-death-adam-raine-lawsuit-rcna245946"
      - id: ai-psychosis
        label: "'AI psychosis'"
        kind: issue
        desc: "Clinicians documented chatbot-reinforced delusional spirals; OpenAI disclosed ~0.07% of weekly users (~560,000 people) show possible psychosis or mania signals."
        source: "https://en.wikipedia.org/wiki/AI-induced_psychosis"
      - id: deepfake-fraud
        label: "Deepfake fraud economy"
        kind: incident
        desc: "A Hong Kong finance worker paid out ~$25.6M after a video call of entirely deepfaked colleagues (2024); voice-clone and celebrity investment scams industrialized alongside."
        source: "https://fortune.com/europe/2024/05/17/arup-deepfake-fraud-scam-victim-hong-kong-25-million-cfo"
      - id: ai-csam-surge
        label: "AI-generated CSAM surge"
        kind: incident
        desc: "AI CSAM videos grew 260-fold from 13 (2024) to 3,443 (2025), 65% in the most severe category (IWF); first US federal charges for purely synthetic CSAM in 2024."
        source: "https://www.iwf.org.uk/about-us/why-we-exist/our-research/how-ai-is-being-abused-to-create-child-sexual-abuse-imagery"

  # ------------------------------------------------------------ INFOSPHERE --
  - id: infosphere

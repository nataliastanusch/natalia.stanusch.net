        source: "https://www.404media.co/ai-slop-is-a-brute-force-attack-on-the-algorithms-that-control-reality/"
      - id: science-slop
        label: "Slop in scientific literature"
        kind: incident
        desc: "GPT-fabricated papers pollute Google Scholar; 'tortured phrases' propagate through journals; a published rat figure was anatomically absurd AI output."
        source: "https://misinforeview.hks.harvard.edu/article/gpt-fabricated-scientific-papers-on-google-scholar-key-features-spread-and-implications-for-preempting-evidence-manipulation/"
      - id: workslop
        label: "Workslop"
        kind: issue
        desc: "AI output masquerading as good work: 41% of surveyed US workers receive it monthly, costing ~2 hours and ~$186 per worker per month to remediate (BetterUp/Stanford, 2025)."
        source: "https://hbr.org/2025/09/ai-generated-workslop-is-destroying-productivity"
      - id: brain-rot-lexicon
        label: "'Slop' enters the lexicon"
        kind: response
        desc: "Oxford named 'brain rot' Word of the Year 2024 with 'slop' shortlisted — the culture naming its own degradation."
        source: "https://corp.oup.com/word-of-the-year/"
      - id: sora-video-slop
        label: "Sora 2 and video slop"
        kind: incident
        desc: "OpenAI's Sora app hit #1 while its feed filled with copyright-flouting slop; the default copyright opt-out was reversed and deepfake cameos restricted under pressure (Oct 2025)."
        source: "https://www.cnbc.com/2025/10/20/open-ai-sora-bryan-cranston-sag-aftra.html"
      - id: election-deepfakes
        label: "Election deepfakes"
        kind: incident
        desc: "Fake audio dropped into Slovakia's pre-election silence (2023); an AI Biden robocall told New Hampshire Democrats not to vote (2024, $6M FCC fine)."
        source: "https://cyberscoop.com/fcc-fine-joe-biden-deepfake-new-hampshire-robocall-steve-kramer/"
      - id: state-actor-ops
        label: "State actors weaponize LLMs"
        kind: incident
        desc: "OpenAI threat reports document disrupted influence operations from Russia, China, Iran and commercial firms using its models for content generation."
        source: "https://openai.com/global-affairs/an-update-on-disrupting-deceptive-uses-of-ai/"
      - id: grok-alignment-incidents
        label: "Grok: 'white genocide' & MechaHitler"
        kind: incident
        desc: "Grok inserted 'white genocide' claims into unrelated replies (May 2025), then praised Hitler as 'MechaHitler' after a 'politically incorrect' prompt update (July 2025) — owner-directed tuning with weak change control."
        source: "https://www.bbc.com/news/articles/cn0ke9jgd9vo"

  # ------------------------------------------------------------------- LAW --
  - id: law
    label: "Courts & litigation"
    color: "#7f8fe8"
    group: political
    x: 82
    y: 55
    w: 15
    blurb: "Where the fights get decided"
    nodes:
      - id: bartz-v-anthropic
        label: "Bartz v Anthropic ruling"
        kind: response
        desc: "Judge Alsup (June 2025): training on lawfully bought, destructively scanned books is 'spectacularly transformative' fair use — but keeping 7M pirated copies is not."
        source: "https://legalblogs.wolterskluwer.com/copyright-blog/the-bartz-v-anthropic-settlement-understanding-americas-largest-copyright-settlement/"
      - id: anthropic-settlement
        label: "$1.5B Anthropic settlement"
        kind: response
        desc: "The largest US copyright settlement ever: ~$3,000 per work across ~482,460 pirated books; final approval July 2026, first payouts pending appeals."
        source: "https://authorsguild.org/news/court-grants-final-approval-anthropic-copyright-settlement/"
      - id: kadrey-v-meta
        label: "Kadrey v Meta ruling"
        kind: response
        desc: "Judge Chhabria (June 2025) granted Meta summary judgment on fair use — while flagging that a 'market dilution' theory could well win future cases."
        source: "https://www.goodwinlaw.com/en/insights/publications/2025/06/alerts-practices-aiml-northern-district-of-california-judge-rules"
      - id: thomson-reuters-v-ross
        label: "Thomson Reuters v Ross"
        kind: response
        desc: "First ruling rejecting fair use for AI training (Feb 2025, non-generative tool); the Third Circuit heard the first appellate argument on AI-training fair use in June 2026."
        source: "https://www.lawnext.com/2026/06/at-3rd-circuit-judges-press-ross-and-thomson-reuters-on-fair-use-ai-training-and-market-harm.html"
      - id: getty-v-stability
        label: "Getty v Stability (UK)"
        kind: response
        desc: "The UK High Court dismissed Getty's remaining copyright claims (Nov 2025) — training happened outside the UK — exposing a territoriality loophole; only limited trademark infringement found."
        source: "https://www.lw.com/en/insights/getty-images-v-stability-ai-english-high-court-rejects-secondary-copyright-claim"
      - id: gema-v-openai
        label: "GEMA v OpenAI (Munich)"
        kind: response
        desc: "Munich court found memorized song lyrics in ChatGPT outputs infringe and are not covered by the EU text-and-data-mining exception (Nov 2025)."
        source: "https://www.taylorwessing.com/en/insights-and-events/insights/2025/11/gema-v-openai"
      - id: nyt-v-openai
        label: "NYT v OpenAI & Microsoft"
        kind: response
        desc: "The flagship news-publisher copyright suit (filed Dec 2023) survived dismissal and remains in discovery into 2026, consolidated with other publisher cases."
        source: "https://ailawsuittracker.com/cases/new-york-times-v-openai/"
      - id: chatlog-discovery-order
        label: "20M chat logs discovery order"
        kind: incident
        desc: "A court ordered OpenAI to hand plaintiffs 20 million de-identified ChatGPT conversations (2025-26); an earlier preservation order briefly forced retention of billions of user chats."
        source: "https://natlawreview.com/article/openai-loses-privacy-gambit-20-million-chatgpt-logs-likely-headed-copyright"
      - id: suno-udio-settlements
        label: "Music labels settle with AI"
        kind: response
        desc: "'Launch, train, settle': UMG and Warner turned their Suno/Udio suits into licensing deals (2025); the musicians' union then sued the labels for cutting artists out."
        source: "https://www.musicbusinessworldwide.com/universal-music-settles-udio-lawsuit-strikes-deal-for-licensed-ai-music-platform/"
      - id: ai-antitrust-probes
        label: "Antitrust probes"
        kind: response
        desc: "FTC/DOJ scrutiny of Microsoft-OpenAI-Nvidia and cloud concentration; the FTC's 6(b) report flagged cloud-AI partnership lock-in; UK CMA found material influence but no control."
        source: "https://www.ftc.gov/news-events/news/press-releases/2025/01/ftc-issues-staff-report-ai-partnerships-investments-study"

  # ---------------------------------------------------------------- POLICY --
  - id: policy
    label: "Policy & governance"
    color: "#4f8fe0"
    group: political
    x: 102
    y: 55
    w: 22
    blurb: "Regulation, and its unmaking"
    nodes:
      - id: eu-ai-act
        label: "EU AI Act"
        kind: response
        desc: "The first comprehensive AI law (in force Aug 2024): prohibitions from Feb 2025, GPAI duties from Aug 2025 — the 'Brussels effect' bet on risk-based regulation."
        source: "https://www.gibsondunn.com/eu-ai-act-omnibus-agreement-postponed-high-risk-deadlines-and-other-key-changes/"
      - id: gpai-code-of-practice
        label: "GPAI Code of Practice"
        kind: response
        desc: "Voluntary code operationalizing the AI Act for model providers; OpenAI, Anthropic, Google and Mistral signed — Meta refused, xAI signed only the safety chapter."
        source: "https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai"
      - id: digital-omnibus-delay
        label: "Digital Omnibus rollback"
        kind: incident
        desc: "Under industry and US pressure, the EU deferred high-risk obligations to Dec 2027/Aug 2028 (Regulation 2026/1744) — deregulation-by-simplification, say civil-society critics."
        source: "https://www.praxikon.com/en/posts/digital-omnibus-high-risk-postponement-december-2027"
      - id: us-deregulatory-pivot
        label: "US deregulatory pivot"
        kind: incident
        desc: "Trump rescinded Biden's AI executive order (Jan 2025); the 'AI Action Plan' (July 2025) set 90+ pro-innovation actions; the US AI Safety Institute was renamed and narrowed."
        source: "https://www.whitehouse.gov/wp-content/uploads/2025/07/Americas-AI-Action-Plan.pdf"
      - id: state-preemption-fight
        label: "Federal vs state AI laws"
        kind: incident
        desc: "A 10-year moratorium on state AI laws died 99-1 in the Senate (July 2025), then returned as a Dec 2025 executive order creating a DOJ task force to sue states — the patchwork war continues."
        source: "https://www.sidley.com/en/insights/newsupdates/2025/12/unpacking-the-december-11-2025-executive-order"
      - id: take-it-down-act
        label: "TAKE IT DOWN Act"
        kind: response
        desc: "Federal law criminalizing real and AI-generated NCII (May 2025); platforms must run 48-hour notice-and-removal; FTC enforcement began May 2026."
        source: "https://www.ftc.gov/news-events/news/press-releases/2026/05/ftc-begins-enforcing-take-it-down-act"
      - id: defiance-act
        label: "DEFIANCE Act"
        kind: response
        desc: "Civil remedy for NCII deepfake victims (up to $150k damages); re-passed the Senate in Jan 2026 amid the Grok crisis, pending in the House."
        source: "https://www.congress.gov/bill/119th-congress/senate-bill/1837/text"
      - id: california-sb53
        label: "California SB 53"
        kind: response
        desc: "After the SB 1047 veto, the Transparency in Frontier AI Act (Sept 2025) became the first US frontier-model law: safety frameworks, incident reporting, whistleblower protection."
        source: "https://www.whitecase.com/insight-alert/california-enacts-landmark-ai-transparency-law-transparency-frontier-artificial"
      - id: colorado-ai-act
        label: "Colorado AI Act delays"
        kind: incident
        desc: "The first comprehensive US state AI law (2024) was delayed and scaled back twice under lobbying deadlock — now effective 2027, exhibit A for patchwork instability."
        source: "https://coloradosun.com/2025/08/25/colorado-ai-law-tweak-dies/"
      - id: ny-raise-act
        label: "New York RAISE Act"
        kind: response
        desc: "New York's frontier-model law (signed Dec 2025, effective 2027) creates a two-state frontier regime with California — and a direct collision with the federal preemption push."
        source: "https://www.wiley.law/alert-New-York-Finalizes-RAISE-Act-for-Frontier-AI-Models-Law-Takes-Effect-January-1-2027"
      - id: texas-illinois-laws
        label: "Texas & Illinois AI laws"
        kind: response
        desc: "Texas bans intent-based AI harms (TRAIGA, 2026); Illinois made discriminatory AI in employment a civil-rights violation and became first to ban AI psychotherapy."
        source: "https://www.klgates.com/Pared-Back-Version-of-the-Texas-Responsible-Artificial-Intelligence-Governance-Act-Signed-Into-Law-6-24-2025"
      - id: italy-ai-law
        label: "Italy's AI law & deepfake crime"
        kind: response
        desc: "Law 132/2025 made Italy the first EU state with a national AI law, criminalizing harmful deepfakes with 1-5 years' imprisonment."
        source: "https://securiti.ai/italy-ai-law-guide/"
      - id: korea-deepfake-law
        label: "South Korea deepfake law"
        kind: response
        desc: "After the Telegram crisis, South Korea criminalized possessing or even viewing sexual deepfakes (Sept 2024) and passed the first comprehensive Asian AI framework act."
        source: "https://www.cnn.com/2024/09/26/asia/south-korea-deepfake-bill-passed-intl-hnk"
      - id: denmark-likeness-bill
        label: "Denmark: copyright your face"
        kind: response
        desc: "Danish bill giving every person copyright-style rights over their face, body and voice against deepfakes — the first property-in-likeness regime in Europe, expected 2026."
        source: "https://schjodt.com/news/owning-the-self-denmarks-copyright-turn-against-deepfakes"
      - id: dsa-x-enforcement
        label: "DSA v X: fine & Grok probe"
        kind: response
        desc: "The Commission fined X €120M (Dec 2025) — the first DSA fine — then opened proceedings over Grok-generated sexual deepfakes and CSAM risk (Jan 2026)."
        source: "https://www.france24.com/en/live-news/20260108-eu-orders-musk-s-grok-ai-to-keep-data-after-nudes-outcry"
      - id: ofcom-grok-probe
        label: "Ofcom investigates X/Grok"
        kind: response
        desc: "Ofcom opened an Online Safety Act investigation (Jan 2026) into Grok's undressing feature and potential CSAM — the first OSA test of a generative-AI feature."
        source: "https://www.ofcom.org.uk/online-safety/illegal-and-harmful-content/ofcom-launches-investigation-into-x-over-grok-sexualised-imagery"
      - id: california-ag-xai
        label: "California AG v xAI"
        kind: response
        desc: "AG Bonta opened an NCII/CSAM investigation into Grok and sent xAI a cease-and-desist (Jan 2026) demanding it stop generating and distributing NCII."
        source: "https://www.oag.ca.gov/news/press-releases/attorney-general-bonta-sends-cease-and-desist-letter-xai-demands-it-halt-illegal"
      - id: gdpr-training-fights
        label: "GDPR vs training data"
        kind: response
        desc: "The Irish DPC forced X to stop using EU posts for Grok (2024) and opened a formal inquiry; noyb fights Meta's opt-out 'legitimate interest' basis — opt-in vs opt-out showdown."
        source: "https://www.dataprotection.ie/en/news-media/latest-news/dpc-statement-meta-ai"
      - id: garante-fines
        label: "Garante & Clearview fines"
        kind: response
        desc: "Italy fined OpenAI €15M and Replika's maker €5M; Clearview has accumulated ~€100M in EU fines — largely unpaid, exposing the enforcement gap for non-EU firms."
        source: "https://www.insurancejournal.com/news/international/2025/05/20/824403.htm"
      - id: ai-summits
        label: "Summits: safety to investment"
        kind: incident
        desc: "From Bletchley's frontier-risk declaration (2023) to Paris (2025), where the US and UK refused to sign and investment displaced safety; New Delhi (2026) brought Global South agenda-setting."
        source: "https://en.wikipedia.org/wiki/India_AI_Impact_Summit_2026"
      - id: global-south-ai
        label: "Global South AI politics"
        kind: issue
        desc: "Extraction of labor, water and energy meets sovereignty responses: UN resolutions, UNESCO ethics, and Latam-GPT — a 60-institution regional model launched Feb 2026."
        source: "https://www.euronews.com/next/2026/02/12/what-is-latam-gpt-latin-americas-spanish-and-portuguese-ai-model"
      - id: uk-copyright-reform
        label: "UK copyright consultation stalls"
        kind: incident
        desc: "After 11,500 responses and a creative-industry revolt ('Make It Fair'), the UK abandoned its preferred TDM opt-out (Mar 2026), leaving AI training in legal limbo."
        source: "https://www.reedsmith.com/articles/uk-copyright-and-ai-report-the-opt-out-is-dead-but-what-comes-next/"


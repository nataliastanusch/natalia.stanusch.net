        source: "https://en.wikipedia.org/wiki/AI_slop"
      - id: facebook-slop-farms
        label: "Shrimp Jesus slop farms"
        kind: incident
        desc: "Facebook pages farm engagement with surreal AI images amplified by the algorithm and paid via creator bonuses (documented by 404 Media and Stanford, 2024)."

        desc: "Explicit AI images of Taylor Swift went viral on X (Jan 2024) — one post reached ~45M views; X temporarily blocked searching her name; the White House called for legislation."
        source: "https://en.wikipedia.org/wiki/Taylor_Swift_deepfake_pornography_controversy"
      - id: grok-spicy-mode
        label: "Grok Imagine 'spicy mode'"
        kind: incident

# Groups for the "Filter by" tag picker on /publications/ and /projects/.
#
# Each entry under `groups` is a heading in the picker, and the order here is
# the order on the page. Inside a group, `items` is a list of blocks:
#   - a block WITH a `name` renders as a labelled subgroup
#   - a block WITHOUT a `name` renders its tags loose, at that position
#
# Subgroups are supported but deliberately unused right now: one flat run of
# tags per heading is easier to scan than headings inside headings. Add a
# `name` to a block if a group ever grows enough to need the extra level.
#
# Tags are listed most-used first, because the picker shows the head of each
# group and hides the tail behind a "+ N more" toggle. Reorder freely - the
# picker follows this file exactly.
#
# Matching is case-insensitive, and the pill always shows the tag exactly as
# it is written in the entry's front matter. A tag listed here that no entry
# uses is simply skipped, so it is safe to list tags ahead of using them.
# Any tag used by an entry but missing from this file collects under "Other"
# at the end of the picker - a useful place to spot tags that need a home.

groups:
  - name: Platforms & companies
    items:
      - tags:
          - chatbots
          - TikTok
          - Big Tech
          - search engine
          - recommendation algorithms
          - Instagram
          - Wikipedia
          - Google
          - OpenAI
          - Altman
          - ChatGPT
          - X
          - WhatsApp
          - Meta
          - Zuckerberg
          - Metaverse
          - virtual reality
          # Listed ahead of use - they cost nothing until an entry uses them.
          - Copilot
          - Gemini
          - Grok
          - Facebook

  - name: AI
    items:
      - tags:
          - AI
          - genAI imagery
          - AI slop
          - Agentic AI Accounts
          - AI magic
          - AI search
